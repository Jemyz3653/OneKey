name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: API notes (signatures only)
        if: always()
        run: |
          set +e
          CP=$(find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null | tr '\n' ':')
          mkdir -p /tmp/mc && for j in $(find ~/.gradle/caches/fabric-loom/26.3 -name '*.jar'); do unzip -qo "$j" 'net/minecraft/*' -d /tmp/mc 2>/dev/null; done
          : > api.txt
          for pat in 'net/minecraft/client/Camera.class' 'net/minecraft/client/renderer/GameRenderer.class' \
                     '*/CameraRenderState.class' '*/LevelRenderState.class' '*/GameRenderState.class' \
                     'net/minecraft/client/gui/components/EditBox.class' 'net/minecraft/client/gui/screens/Screen.class' \
                     'net/minecraft/client/multiplayer/ServerData.class' 'net/minecraft/client/Options.class' \
                     'net/minecraft/client/renderer/Projection*.class' '*/ProjectionMatrix*.class' ; do
            for f in $(cd /tmp/mc && find . -path "./$pat" -o -path "$pat" 2>/dev/null | sed 's|^\./||'); do
              c=${f%.class}; c=${c//\//.}
              echo "=== $c" >> api.txt
              javap -p -cp "$CP" "$c" | grep -v 'lambda\$' >> api.txt 2>&1
            done
          done
          echo "=== Entity invisible" >> api.txt
          javap -p -cp "$CP" net.minecraft.world.entity.Entity | grep -i "invisib\|level()\|position()" >> api.txt
          grep -rl --include=*.class -a "getProjectionMatrix\|projectionMatrix" /tmp/mc | sed 's|/tmp/mc/||' | head -20 >> api.txt

      - name: Upload jar
        if: steps.build.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: OneKey
          path: build/libs/*

      - name: Publish CI notes
        if: always()
        run: |
          set +e
          mkdir -p /tmp/report && cp build.log api.txt /tmp/report/ && cp build/libs/*.jar /tmp/report/ 2>/dev/null
          cd /tmp/report
          echo "build exit code: ${{ steps.build.outputs.code }} (${{ github.sha }})" > STATUS.txt
          git init -q -b ci-notes && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "CI notes ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-notes

      - name: Fail if build failed
        if: steps.build.outputs.code != '0'
        run: exit 1
