name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Client gametests (screenshots)
        id: gametest
        if: steps.build.outputs.code == '0'
        timeout-minutes: 20
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers > /dev/null
          mkdir -p build/run/clientGameTest
          echo "eula=true" > build/run/clientGameTest/eula.txt
          printf 'version:4896\npreferredGraphicsBackend:"vulkan"\n' > build/run/clientGameTest/options.txt
          ./gradlew runClientGameTest --no-daemon 2>&1 | tee gametest.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          mkdir -p shots
          find build/run -path '*screenshots*' \( -name '*.png' -o -name 'notes.txt' \) -exec cp {} shots/ \;
          exit 0

      - name: Upload jar
        if: steps.build.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: OneKey
          path: build/libs/*

      - name: Release
        if: steps.build.outputs.code == '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          FILE="build/libs/onekey-${VERSION}.jar"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "$FILE" --clobber
          else
            gh release create "v${VERSION}" "$FILE" --target "${GITHUB_SHA}" --title "OneKey ${VERSION}" \
              --notes "OneKey for Minecraft 26.3 (Fabric). Put the same jar on the server and on the clients of the players who should get it."
          fi

      - name: Publish screenshots to the test-shots branch
        if: always() && github.event_name == 'push'
        run: |
          set +e
          mkdir -p shots && cd shots
          grep -E "OneKeyTest" ../gametest.log > test-log.txt 2>/dev/null
          echo "Screenshots from the client gametests of ${GITHUB_SHA}" > README.md
          git init -q -b test-shots && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "gametest screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" test-shots
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" --delete ci-notes 2>/dev/null || true

      - name: Fail if build failed
        if: steps.build.outputs.code != '0'
        run: exit 1
